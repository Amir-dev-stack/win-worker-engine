name: WIN worker engine checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run WIN architecture checks
        run: node scripts/build.mjs
      - name: Parse dashboard JavaScript\n        run: node --check public/app.js\n      - name: Parse and bundle every Netlify function
        run: npx --yes esbuild@0.25.0 --bundle --packages=external --platform=node --target=node22 --outdir=/tmp/win-engine-build-check netlify/functions/*.mts
