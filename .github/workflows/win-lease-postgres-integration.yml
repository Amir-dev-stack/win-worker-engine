name: WIN isolated PostgreSQL lease concurrency verification

on:
  pull_request:
    branches:
      - fix/win-cloud-backup-main-reconciliation-20261119
    paths:
      - .github/workflows/win-lease-postgres-integration.yml
      - db/draft_win_dev_fenced_lease.sql
      - scripts/win-development-lease-postgres.integration.test.mjs
      - scripts/win-development-lease-pg-config.mjs
      - scripts/win-development-lease-store.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: win-lease-postgres-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-postgres:
    # Never run for unrelated PRs or other branches. A manual dispatch is
    # accepted only on the repo's sandbox draft branch.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.number == 72 &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: win_lease_test_ci
          POSTGRES_USER: win_local_tester
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U win_local_tester -d win_lease_test_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ensure PostgreSQL client exists
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client >/dev/null
          fi
          command -v psql
      - name: Verify competing claims, revocation, expiry and stale fencing
        env:
          WIN_LEASE_LOCAL_PG_TEST: run
          WIN_LEASE_TEST_DATABASE_URL: postgresql://win_local_tester:synthetic_ci_only@127.0.0.1:5432/win_lease_test_ci
        run: node --test scripts/win-development-lease-postgres.integration.test.mjs
