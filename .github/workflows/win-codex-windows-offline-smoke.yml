name: WIN Codex Windows launcher offline smoke (no model calls)

on:
  push:
    branches:
      - feat/win-auto-model-router-20261118
    paths:
      - scripts/win-model-router.mjs
      - scripts/Start-WINAutoModels.ps1
      - scripts/win-model-router.test.mjs
      - .github/workflows/win-codex-windows-offline-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-offline-preflight:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate PowerShell launcher dry run and offline model evidence without Codex
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = Join-Path (Get-Location).Path 'scripts/Start-WINAutoModels.ps1'
          # No Codex login, no API key, no model calls, no dispatch. Both paths must stop before execution.
          $dryText = (& $launcher -Task 'Update README documentation' | Out-String)
          if ($dryText -notmatch 'Dry run only') { throw 'Dry-run unexpectedly failed or attempted dispatch.' }
          $start = [DateTime]::UtcNow.AddMinutes(-5)
          $end = [DateTime]::UtcNow.AddMinutes(25)
          $catalog = @{
            source = 'codex-app-server:model/list'
            verifiedAt = $start.ToString('o')
            expiresAt = $end.ToString('o')
            models = @(@{ id = 'gpt-6.1-terra'; available = $true; allowed = $true; supportedEfforts = @('low') })
          } | ConvertTo-Json -Depth 8
          $evidencePath = Join-Path $env:RUNNER_TEMP 'win-codex-offline-evidence.json'
          Set-Content -LiteralPath $evidencePath -Value $catalog -Encoding utf8
          $verifyText = (& $launcher -Task 'Update README documentation' -VerifyModelsOnly -VerifiedModels $evidencePath | Out-String)
          if ($verifyText -notmatch 'Account quota was NOT queried') { throw 'Offline preflight incorrectly claimed live quota verification.' }
          if ($verifyText -match 'Starting one bounded Codex task') { throw 'Offline smoke attempted a coding task.' }
          # Expired evidence must not be accepted.
          $expired = $catalog | ConvertFrom-Json
          $expired.expiresAt = [DateTime]::UtcNow.AddMinutes(-1).ToString('o')
          $expired | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $evidencePath -Encoding utf8
          $rejected = $false
          try { & $launcher -Task 'Update README documentation' -VerifyModelsOnly -VerifiedModels $evidencePath | Out-Null }
          catch { $rejected = $true }
          if (-not $rejected) { throw 'Expired model evidence was incorrectly accepted.' }
          "Windows offline smoke PASSED: no credentials, no model calls, no task execution." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
