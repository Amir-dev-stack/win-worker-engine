name: WIN Netlify function validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run WIN build and quality gates
        run: |
          node scripts/build.mjs
          node scripts/quality-gates.mjs

      - name: Bundle every Netlify function with esbuild
        run: |
          npx --yes esbuild netlify/functions/*.mts --bundle --packages=external --platform=node --format=esm --outdir=/tmp/win-netlify-functions
