name: WIN read-only NFL source audit

on:
  pull_request:
    branches: [main]
    paths:
      - "netlify/lib/nflverse-pbp-adapter.mts"
      - "scripts/nflverse-pbp-adapter.test.mjs"
      - "scripts/nflverse-readonly-audit.mjs"
      - ".github/workflows/nflverse-readonly-audit.yml"
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season to audit (defaults to current season)"
        required: false
        type: string

concurrency:
  group: nflverse-readonly-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only source and payload audit
        env:
          NFLVERSE_AUDIT_SEASON: ${{ github.event.inputs.season || '' }}
        run: node --experimental-strip-types scripts/nflverse-readonly-audit.mjs
